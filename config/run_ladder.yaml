# The real ladder run: 20 generations x 5 seasons/gen (5-of-7 sampled from the
# train pool each generation), Haiku gens 0-9 then Sonnet gens 10-19.
# Measured: ~$3.4/Haiku draft (no caching: prefix < Haiku's 4096-token minimum);
# Sonnet drafts DO cache (2048-token minimum clears), offsetting its higher rate.
# Holdout seasons are never drafted during evolution: `ffr eval-holdout` after.
run:
  generations: 20
  agents: 14
  llm_agents: 14
  seasons_per_generation: 5
  train_seasons: [2016, 2017, 2018, 2019, 2020, 2021, 2022]
  holdout_seasons: [2023, 2024]
  drafter_model: claude-haiku-4-5      # fallback; model_schedule overrides
  model_schedule:
    - {from_gen: 0, model: claude-haiku-4-5}
    - {from_gen: 10, model: claude-sonnet-4-6}
  rewriter_model: claude-sonnet-4-6
  auditor_model: claude-opus-4-8
  max_tool_calls_per_pick: 6
  late_round_start: 11                 # rounds 11+ use the reduced budget
  late_round_tool_calls: 2
  prep_research: true
  prep_tool_calls: 3
  on_clock_tool_calls: 2
  faller_threshold: 8
  extension_tool_calls: 3
  llm_rounds: 15
  budget_usd: 1000.0
  seed: 42
  audit_strip_threshold: 0.30
