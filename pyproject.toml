[project]
name = "ffr"
version = "0.1.0"
description = "Evolutionary LLM harness for fantasy football drafting"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "nflreadpy>=0.1",
    "polars>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyahocorasick>=2.1",
    "tenacity>=9.0",
    "trafilatura>=1.12",
    "htmldate>=1.8",
    "rich>=13.0",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
ffr = "ffr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
